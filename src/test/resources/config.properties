# Base URI of the server under test. Here: the shop-api.
# It can be changed for one run without editing this file:  mvn test -DbaseUri=http://localhost:8081
# The accounts below belong to the shop-api. For another API, use the accounts of that API.

baseUri=http://localhost:8081

#baseUri = http://localhost:8080

# TOKEN CACHING
# AuthUtils.login() keeps one token for each USERNAME. It does not keep one token for each key.
# So if two keys use the same username, they get the same token.
# The login request is sent only once for that username, the first time it is needed.
# Later calls, even through a different key, return the cached token.
# Example: auth.validUser and auth.account.admin both use "admin", so both get the same token.

# FULL-PERMISSION ACCOUNT
# This account can do everything.
# It is the default account for every scenario that does NOT test authentication or authorization,
# for example payload validation, content negotiation and routing.
# HeaderFactory uses it, for example in bearerAuthHeadersForFullPermissionUser().
# For a scenario that DOES test an authentication or authorization failure
# (missing or invalid token, wrong Basic credentials, missing permission), use the role accounts below.
# This account must never be the one that gets 401 or 403.
# It is the same account as the role "admin" below.
auth.validUser=admin
auth.validPassword=password123


# ROLE ACCOUNTS
# One account for each role of the backend. They are used by the permission matrix.
#
# Key format:
#   auth.account.<role>.username
#   auth.account.<role>.password
#   <role> = the name of a role of the backend, in lowerCamelCase (here: admin, seller, customer)
#
# THE PERMISSION MATRIX
# The matrix is a table: which role may call which operation.
# (The spec of the shop-api lists it: x-roles at the top, x-permission on each operation.)
# For every operation and every role, the test sends one request:
#   - a role that is allowed: the request must pass the security layer. The answer is not 401 and not 403.
#     Use a request that changes no data (for example a number that does not exist), so the answer is 404 or 422.
#   - a role that is NOT allowed: the answer must be 403.
# So the 403 scenarios come from the matrix. No extra key is needed for them.
#
# RULES
# - One account for each role.
# - Do not write the same key twice. In a .properties file the LAST line wins and the first one is lost,
#   without any warning.
# - Use an account that exists on the server under test, or the login fails.
# - Add a role only when the backend has that role. Do not invent a role.
# - An account with the SAME role as another one is a different need.
#   Example: to test that one customer cannot read the order of another customer, use a second customer account.
#   Give it its own key, for example auth.other.customer.username.
# - A username is not a secret. A password is.
#   The passwords here are for local throw-away servers only.
#   For a shared server, do not write them in this file. Pass them with -D from the command line.
#   for example: mvn test -Dauth.account.admin.password=...
#
# EXAMPLE (the local shop-api)
# Its permissions are named resource:action, for example product:create. A role has a list of them.
# The roles and their permissions are in Role.java (package com.example.shopapi.domain).
#   admin     all permissions
#   seller    product:read, product:create, product:update
#   customer  product:read, cart:read, cart:update, order:read, order:create, order:cancel
#
# HOW TO SHOW THAT THE TESTS CAN FAIL (example, local shop-api)
# Create a bug on purpose: 
# in Role.java under com.example.shopapi.domain, 
# add a permission to a role that must not have it
# (for example "user:read" to customer), then restart the backend.
# The matrix cell "customer x GET /users" expects 403, and now gets 200, so it must fail.
# Take the extra permission away again afterwards.
#
# To change the username go to AccountStore.java under com.example.shopapi.domain
#
auth.account.admin.username=admin
auth.account.admin.password=password123

auth.account.seller.username=seller1
auth.account.seller.password=password123

auth.account.customer.username=customer1
auth.account.customer.password=password123


# OTHER KEY STYLE: auth.role.<resource>No<Action>Role (NOT used in this file)
# Use it when the permission matrix of a backend is NOT known, so you cannot write the table above.
# Then you add one account for each denial that the backend team confirms.
#
#   auth.role.<resource>No<Action>Role.username
#   auth.role.<resource>No<Action>Role.password
#   <resource> = the resource that the permission is about, in lowerCamelCase, for example booking or orderItem
#   <Action>   = the action that is denied: Create (POST), Read (GET), Update (PUT, PATCH), Delete (DELETE)
#   The RESOURCE comes first, then the ACTION. It is the same order as in a permission name like booking:create.
#   Example: auth.role.bookingNoCreateRole = an account that cannot Create (POST) a booking.
#
# - The role name that a test passes to HeaderFactory.bearerAuthHeadersForRole(...)
#   is the part after "auth.role.", for example "bookingNoCreateRole".
# - A key is the NAME OF A TEST NEED, for example "an account that cannot create a booking".
#   The account behind it (for example "viewer") is a role of the backend.
# - The Action is the name of the permission, not of the HTTP method.
#   One action can cover more than one method. Example: Update covers PUT and PATCH.
# - Each key names ONE (resource, action) pair. Do not infer from the name alone that the account is denied
#   for the same action on other resources, or for other actions on the resource.
#   Those are separate, unconfirmed claims. Add a separate key for each confirmed pair.
# - Do not point the keys of different pairs at the same account
#   unless the backend team confirms that the account is denied for all of them.
#
# A backend can design its permissions in (at least) three ways. Often we do not know which one it uses:
#   1. Action-only, resource-agnostic  - denied for an action = denied for it on EVERY resource.
#   2. (Resource, Action)-specific     - denied for an action on one resource may still be allowed on another.
#   3. Resource-level, coarse          - denied for one write action on a resource = denied for ALL write actions on it.
# Until the backend team confirms the model, assume the MOST SPECIFIC one (model 2).
#
# EXAMPLE (the local booking-api, port 8080)
# Its permissions are booking:read, booking:create, booking:update and booking:delete. The accounts are
# defined in UserStore.java (package com.example.bookingapi.auth). The account "viewer" has READ permission only,
# so it is denied for create, update and delete alike. That is why the three keys
# auth.role.bookingNoCreateRole, auth.role.bookingNoUpdateRole and auth.role.bookingNoDeleteRole may share it.
# This is confirmed by that backend, not assumed.
# To create a bug on purpose there: in UserStore.java, give "viewer" the create, update and delete permissions,
# then restart. The scenarios that use these keys must then fail.


